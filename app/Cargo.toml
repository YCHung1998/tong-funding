[package]
name = "tong-funding"
version.workspace = true
edition.workspace = true

[dependencies]
gpui-kit = "=0.7.1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
tong-funding-core = { version = "0.1.0", path = "../core" }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3.34"
rusqlite = { version = "0.40.2", features = ["bundled", "hooks"] }
hmac = "0.13.0"
sha2 = "0.11.0"
hex = "0.4.3"
base64 = "0.22"
http = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
rust_decimal = { version = "1.43.0", features = ["serde-str"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
keyring = { version = "3", features = ["apple-native"] }

[dev-dependencies]
tempfile = "3"
# Headless UI tests (click/scroll by element id); only enabled for test builds.
gpui-kit = { version = "=0.7.1", features = ["test-support"] }
# Paused tokio time in engine actor tests (no real waiting).
tokio = { version = "1.53.2", features = ["test-util"] }
